# S-EMBER memory MCQ task — Gemini-generated multiple-choice variant.
#
# The dataset jsonl must be placed at ``data/sember_mcq.jsonl``
# (relative to the repository root). See ``data/README.md``. Each record
# must contain at least: question, options (list[str]), correct_letter,
# video_id, question_time, question_category.

dataset_path: json
dataset_kwargs:
  data_files:
    test: data/sember_mcq.jsonl
task: sember_mcq
test_split: test
output_type: generate_until
doc_to_visual: !function utils.sember_doc_to_visual
doc_to_text: !function utils.sember_doc_to_text_mcq
doc_to_target: "correct_letter"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.sember_process_results_mcq
metric_list:
  - metric: sember_mcq_accuracy
    aggregation: !function utils.sember_aggregate_results_mcq
    higher_is_better: true
metadata:
  - version: 0.2
