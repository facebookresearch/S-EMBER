# S-EMBER memory grounding task — answer generation + temporal interval.
#
# The dataset jsonl must be placed at ``data/sember_grounding.jsonl``
# (relative to the repository root). See ``data/README.md``. Each
# record must contain at least: question, video_id, question_time,
# question_category, answer, answer_start_time, answer_end_time.
#
# By default this task reports temporal IoU only (no LLM judge required).
# To additionally score answer correctness, run the optional Gemini
# judge in tools/judge_grounding.py against the produced samples jsonl.

dataset_path: json
dataset_kwargs:
  data_files:
    test: data/sember_grounding.jsonl
task: sember_grounding
test_split: test
output_type: generate_until
doc_to_visual: !function utils.sember_doc_to_visual
doc_to_text: !function utils.sember_doc_to_text_with_grounding
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 256
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.sember_process_results_grounding
metric_list:
  - metric: sember_temporal_iou
    aggregation: !function utils.sember_aggregate_temporal_iou
    higher_is_better: true
metadata:
  - version: 0.2
